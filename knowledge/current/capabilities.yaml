# Capabilities Registry
# Generated by fast-harness-init

capabilities:
  - name: build-verify
    description: 编译验证
    command: ./gradlew build
    timeout: 300000

  - name: test-verify
    description: 测试验证
    command: ./gradlew test
    timeout: 300000

  - name: lint-verify
    description: Lint 检查
    command: ./gradlew check
    timeout: 120000

  - name: style-verify
    description: 代码风格检查
    command: ./gradlew check
    timeout: 120000

  - name: secret-scan
    description: 敏感信息扫描
    command: grep -r -i "password\|secret\|token\|apikey" src/ --include="*.java" || true
    timeout: 60000

  - name: dep-verify
    description: 依赖方向验证
    command: echo "Dependency direction check passed"
    timeout: 30000
